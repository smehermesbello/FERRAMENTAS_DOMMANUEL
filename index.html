<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA DOM MANUEL - GESTÃO</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- html2pdf & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- PDF.js para extração de texto dos PDFs de cardápio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-window">
        <img src="LOGO.png" alt="Logo" class="corner-logo">

        <!-- MENU PRINCIPAL -->
        <div id="screen-menu" class="screen flex-center">
            <h1 class="main-title">GESTÃO ESCOLAR</h1>
            <div class="button-grid">
                <button class="btn-liquid btn-green" onclick="openConfig('etiqueta')">🏷️ ETIQUETAS</button>
                <button class="btn-liquid btn-blue" onclick="openConfig('carometro')">📸 CARÔMETRO</button>
                <button class="btn-liquid btn-purple" onclick="openConfig('listagem')">📋 LISTAGEM</button>
                <button class="btn-liquid btn-yellow" onclick="openConfig('cracha')">🪪 CRACHÁ</button>
                <button class="btn-liquid btn-cardapio grid-full" onclick="openCardapioConfig()">🍎 CARDÁPIO DO MÊS</button>
            </div>
        </div>

        <!-- CONFIGURAÇÃO PADRÃO (FOTOS / ALUNOS) -->
        <div id="screen-config" class="screen flex-center hidden">
            <div class="glass-card">
                <button class="btn-liquid-small btn-back" onclick="showScreen('screen-menu')">← VOLTAR</button>
                <h2 id="config-title">CONFIGURAÇÃO</h2>
                <div class="field">
                    <label>FOTOS DOS ESTUDANTES:</label>
                    <input type="file" id="file-input" accept="image/*" multiple class="input-liquid">
                </div>
                <div class="field">
                    <label>TURNO:</label>
                    <div class="modern-switch">
                        <input type="radio" id="manha" name="turno" value="manha" checked>
                        <input type="radio" id="tarde" name="turno" value="tarde">
                        <div class="switch-slider"></div>
                        <label for="manha" class="switch-option">☀️ MANHÃ</label>
                        <label for="tarde" class="switch-option">🌙 TARDE</label>
                    </div>
                </div>
                <div class="field">
                    <label>TURMA:</label>
                    <input type="text" id="input-turma" placeholder="Ex: 5º ANO A" class="input-liquid">
                </div>
                <button id="btn-gerar" class="btn-liquid btn-execute-main btn-green" onclick="executarGeracao()">GERAR PRÉVIA</button>
            </div>
        </div>

        <!-- CONFIGURAÇÃO CARDÁPIO (PDFs DA PREFEITURA) -->
        <div id="screen-cardapio-config" class="screen flex-center hidden">
            <div class="glass-card" style="max-width: 550px;">
                <button class="btn-liquid-small btn-back" onclick="showScreen('screen-menu')">← VOLTAR</button>
                <h2 id="config-title">GERAR CARDÁPIO MENSAL</h2>
                
                <div class="field">
                    <label>📄 PDF DO ALMOÇO INTEGRAL:</label>
                    <input type="file" id="pdf-almoco" accept="application/pdf" class="input-liquid">
                </div>

                <div class="field">
                    <label>📄 PDF DOS LANCHES (MANHÃ / TARDE):</label>
                    <input type="file" id="pdf-lanche" accept="application/pdf" class="input-liquid">
                </div>

                <div class="field">
                    <label>MÊS / ANO DO CALENDÁRIO:</label>
                    <input type="text" id="input-mes-ano" placeholder="Ex: AGOSTO / 2026" value="AGOSTO / 2026" class="input-liquid">
                </div>

                <button class="btn-liquid btn-execute-main btn-purple" onclick="processarCardapio()">📅 PROCESSAR E REFORMULAR</button>
            </div>
        </div>

        <!-- PRÉVIA / ÁREA DE IMPRESSÃO / GENERATOR -->
        <div id="screen-preview" class="screen hidden" style="padding:0;">
            <div class="preview-toolbar">
                <div class="toolbar-left">
                    <button class="btn-liquid-small btn-ajustar" onclick="voltarDaPrevia()">← AJUSTAR</button>
                    <div id="download-buttons"></div>
                </div>
            </div>
            <div id="pdf-area-wrapper">
                <div id="pdf-area"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
